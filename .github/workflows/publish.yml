name: Publish AAR

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install CI Maven deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci-maven-deps
          gh release download ci-maven-deps --dir /tmp/ci-maven-deps
          install_m2() {
            local group_path="$1" artifact="$2" version="$3" file_prefix="$4"
            local dest="$HOME/.m2/repository/${group_path}/${artifact}/${version}"
            mkdir -p "$dest"
            cp "/tmp/ci-maven-deps/${file_prefix}.aar" "$dest/${artifact}-${version}.aar"
            cp "/tmp/ci-maven-deps/${file_prefix}.pom" "$dest/${artifact}-${version}.pom"
          }
          install_m2 com/noah noah 15.1.4002 noah-15.1.4002
          install_m2 com/pangle/cn ads-sdk-tools 7.6.4.2-hupu ads-sdk-tools-7.6.4.2-hupu
          install_m2 com/qq/e/union tools 2.4 tools-2.4
      - name: Publish libraries to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          failed=0
          for m in core sdk pangle ylh noah sdk-tools; do
            echo "::group::publish ${m}"
            log_file="/tmp/publish-${m}.log"
            if ./gradlew --no-daemon ":${m}:publish" 2>&1 | tee "$log_file"; then
              echo "published ${m}"
            elif grep -q "status code 409" "$log_file"; then
              echo "${m} already published, skip"
            else
              echo "publish ${m} failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
