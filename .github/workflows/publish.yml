name: Publish AAR to Hupu Nexus

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Publish libraries to Hupu Nexus
        env:
          HUPU_NEXUS_USERNAME: ${{ secrets.HUPU_NEXUS_USERNAME }}
          HUPU_NEXUS_PASSWORD: ${{ secrets.HUPU_NEXUS_PASSWORD }}
        run: |
          set -o pipefail
          failed=0
          for m in core sdk pangle ylh noah sdk-tools; do
            echo "::group::publish ${m}"
            log_file="/tmp/publish-${m}.log"
            if ./gradlew --no-daemon ":${m}:publish" 2>&1 | tee "$log_file"; then
              echo "published ${m}"
            elif grep -q "status code 409" "$log_file"; then
              echo "${m} already published, skip"
            else
              echo "publish ${m} failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
